<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEFENDO</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z" fill="#00f5ff"/>
        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DEFENDO</span>
    </div>
    <div class="popup-toggle-wrap">
      <label class="toggle">
        <input type="checkbox" id="global-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="popup-status" id="popup-status">
    <div class="status-badge safe" id="status-badge">SAFE</div>
    <div class="score-ring" id="score-ring">
      <svg viewBox="0 0 64 64" width="64" height="64">
        <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(0,245,255,0.1)" stroke-width="6"/>
        <circle cx="32" cy="32" r="28" fill="none" stroke="#00f5ff" stroke-width="6"
                stroke-dasharray="176" stroke-dashoffset="176"
                stroke-linecap="round" transform="rotate(-90 32 32)"
                id="score-arc"/>
      </svg>
      <div class="score-text" id="score-text">—</div>
    </div>
  </div>

  <div class="popup-section" id="entities-section">
    <div class="section-title">Detected Entities</div>
    <div id="popup-entities">
      <div class="empty-state">No active scan. Click a field on the page to begin.</div>
    </div>
  </div>

  <div class="popup-section" id="recommendation-section">
    <div class="section-title">Recommendation</div>
    <div class="recommendation allow" id="popup-recommendation">
      <span class="rec-icon">✓</span> Content appears safe to share.
    </div>
  </div>

  <div class="popup-actions">
    <button class="popup-btn primary" id="open-app-btn">Open DEFENDO App</button>
    <button class="popup-btn secondary" id="clear-btn">Clear</button>
  </div>

  <div class="popup-footer">
    <span id="last-scan-time">No scans yet</span>
    <span class="version">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
